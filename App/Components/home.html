!@( component|app )
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>!@( $title )</title>
		<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
	</head>
	<body>
		!@( $body )
	</body>
</html>
!@( end )

!@( component|number_container )
<button hx-get="/random" hx-swap="afterbegin" hx-target="#random-numbers">Add a random number!</button>
<div id="random-numbers">
	!@( $randomNumbers )
</div>
!@( end )

!@( component|random_number )
<div>
	<h2>!@( $randomNumber )</h2>
</div>
!@( end )
