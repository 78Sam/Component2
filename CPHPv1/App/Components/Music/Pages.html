<!-- Songs -->

!@( component|songs )
<div class="offset">
    !@( $songs )
</div>
!@( end )

!@( component|song )
<div class="song" onclick='changeTrack("!@( $title )", "!@( $artist )", "!@( $path )")'>
    <p>!@( $title ) - !@( $artist )</p>
</div>
!@(end)

<!-- Artists -->

!@( component|artists )
<div class="offset">
    !@( $artists )
</div>
!@( end )

!@( component|artist )
<div class="artist">
    <p>!@( $artist )</p>
</div>
!@( end )
